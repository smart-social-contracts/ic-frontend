name: Release ic-frontend

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Build WASM and create release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          target: wasm32-unknown-unknown

      - name: Install ic-wasm
        run: cargo install ic-wasm --version 0.9.10 --locked

      - name: Build ic-frontend WASM
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo build --target wasm32-unknown-unknown --release -p canister
          wasm=target/wasm32-unknown-unknown/release/canister.wasm
          ic-wasm "$wasm" -o "$wasm" metadata candid:service -f ic-certified-assets/assets.did -v public
          ic-wasm "$wasm" -o "$wasm" metadata ic-frontend:version -d "$version" -v public
          gzip -9 -n -c "$wasm" > "ic-frontend@$version.wasm.gz"
          sha256sum "$wasm" | sed "s|$wasm|ic-frontend@$version.wasm|" > "ic-frontend@$version.wasm.sha256"
          cat "ic-frontend@$version.wasm.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2
        with:
          files: |
            ic-frontend@*.wasm.gz
            ic-frontend@*.wasm.sha256
          generate_release_notes: true
